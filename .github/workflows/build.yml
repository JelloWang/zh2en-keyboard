name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          xcodebuild -project ChineseTranslateKeyboard.xcodeproj \
            -target ChineseTranslateKeyboard \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Release-iphoneos/ChineseTranslateKeyboard.app" Payload/
          zip -r ChineseTranslateKeyboard.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zh2en-keyboard-ipa
          path: ChineseTranslateKeyboard.ipa
